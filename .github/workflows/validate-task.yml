name: River Event Task Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check task files
        shell: bash
        run: |
          set -e
          echo "Checking for river event task files"
          find . -name task.toml -type f
          test -f instruction.md -o -f terminal-bench-science/river-event-travel-time-diagnosis/instruction.md
          echo "Basic task file check completed"
